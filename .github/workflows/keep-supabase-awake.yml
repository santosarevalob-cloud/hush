name: Keep Supabase awake

# Supabase free projects pause after ~7 days without activity. One tiny request
# every 3 days prevents that.
# shortcut: GitHub turns off scheduled workflows after 60 days with no commits;
# any push re-arms it, or re-enable it from the repo's Actions tab if GitHub emails you.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error -o /dev/null \
            "$SUPABASE_URL/rest/v1/songs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
